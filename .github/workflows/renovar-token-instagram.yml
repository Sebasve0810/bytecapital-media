name: Renovar token de Instagram

# El token de Instagram vence a los 60 días; se renueva los días 1 y 15 de cada mes.
on:
  schedule:
    - cron: "17 13 1,15 * *"   # 08:17 Bogotá
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Renovar y guardar el token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta el secreto GH_PAT (token de GitHub con permiso Secrets: Read and write en este repo)"
            exit 1
          fi
          python3 tools/renovar_token_instagram.py "$RUNNER_TEMP/ig_token"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/ig_token"
          rm -f "$RUNNER_TEMP/ig_token"
          echo "Secreto IG_ACCESS_TOKEN actualizado"
